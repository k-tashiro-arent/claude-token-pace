name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # 4) shellcheck + bash -n（静的検査）
  shellcheck:
    name: shellcheck & bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck install.sh uninstall.sh bootstrap.sh bin/serve.sh bin/tick.sh bin/scheduler.sh test/smoke.sh test/live-check.sh
      - name: bash -n syntax check
        run: |
          for f in install.sh uninstall.sh bootstrap.sh bin/serve.sh bin/tick.sh bin/scheduler.sh test/smoke.sh test/live-check.sh; do
            bash -n "$f"
          done

  # 5) Python lint（bin/ 配下すべて）
  #    ruff はバージョンを固定する。未固定だと既定ルールの変更だけで
  #    （コードを変えていないのに）CI が赤くなる。検査対象は ruff.toml で固定。
  python-lint:
    name: python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: py_compile
        run: python -m py_compile bin/*.py
      - name: ruff
        run: |
          python -m pip install --quiet 'ruff==0.16.4'
          ruff check bin/

  # 6) macOS の Keychain からの読み出し（実機の security コマンドで確かめる）
  #    一時キーチェーンを作り、検索対象に加えて項目を入れ、bin/*.py が読めることを見る。
  #    **限界**: ここで作る項目の ACL は security 自身のもの。実際に Claude Code が作った
  #    項目を別プロセスが読むとき、Keychain の許可を求められるかどうかまでは確かめられない。
  keychain:
    name: keychain read (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: read credentials from a temporary keychain
        run: |
          set -eu
          KC="$RUNNER_TEMP/tokenpace-ci.keychain-db"
          TOKEN="KC-CI-TOKEN"
          ORIG="$(security list-keychains -d user | tr -d '"' | xargs)"
          cleanup() {
            # shellcheck disable=SC2086
            security list-keychains -d user -s $ORIG >/dev/null 2>&1 || true
            security delete-keychain "$KC" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          security create-keychain -p tokenpace "$KC"
          security unlock-keychain -p tokenpace "$KC"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KC" $ORIG
          security add-generic-password -s "Claude Code-credentials" -a claude-token-pace-ci \
            -w "{\"claudeAiOauth\":{\"accessToken\":\"$TOKEN\",\"expiresAt\":99999999999999}}" "$KC"
          cat > "$RUNNER_TEMP/read_token.py" <<'PY'
          import importlib.util, sys, time
          spec = importlib.util.spec_from_file_location("m", sys.argv[1])
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          try:
              print(m.access_token())
          except TypeError:          # credits-fetch.py は now を取る
              print(m.access_token(time.time()))
          PY
          for f in bin/usage-fetch.py bin/credits-fetch.py; do
            got="$(CLAUDE_CONFIG_DIR="$RUNNER_TEMP/no-such-dir" python3 "$RUNNER_TEMP/read_token.py" "$f")"
            if [ "$got" != "$TOKEN" ]; then
              echo "FAIL: $f が Keychain から読めない (got: $got)" >&2
              exit 1
            fi
            echo "OK: $f -> $got"
          done

  # 1) インストール一気通貫スモークテスト
  # 2) ubuntu + macOS マトリクス、かつ install.sh 直叩き(direct) と
  #    curl ワンライナー経路(bootstrap: ローカル checkout を clone) の両方
  smoke:
    name: smoke (${{ matrix.os }} / ${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        mode: [direct, bootstrap]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # bootstrap がローカルリポジトリを clone するため浅くしない
      - name: ensure deps (jq / python3 / curl / git)
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install jq
            else
              sudo apt-get update && sudo apt-get install -y jq
            fi
          fi
          echo "jq      : $(jq --version)"
          echo "python3 : $(python3 --version)"
          echo "git     : $(git --version)"
          echo "bash    : $(bash --version | head -1)"
      - name: prepare local ref for bootstrap
        if: matrix.mode == 'bootstrap'
        run: git branch -f citest HEAD   # テスト対象コミットを clone 可能なブランチ名で指す
      - name: run smoke test
        env:
          SMOKE_INSTALL_MODE: ${{ matrix.mode }}
          SMOKE_BOOTSTRAP_REF: citest
        run: bash test/smoke.sh
