# ruff の既定ルールはバージョンによって変わる。0.16 系で YTT/BLE/DTZ/S/EXE などが
# 既定に入り、設定を持たなかったこのリポジトリの CI が（コードを変えていないのに）
# 赤くなった。何を検査するかをここで固定し、ruff のバージョンは CI 側で固定する。
#
# 検査するもの:
#   F        pyflakes（未使用 import・未定義名・重複定義など実害のあるもの）
#   E4/E7/E9 import の誤り、構文・実行時エラーに直結するもの
#   W        末尾空白・改行まわり
#   I        import の並び
#
# 意図的に外しているもの（このツールの設計上そう書いている）:
#   BLE001      収集失敗を statusLine やサンプリングに波及させないため、収集系の
#               エントリポイントは包括 except で握って exit 0 する
#   DTZ005/006  グラフの軸・ラベルはローカル時刻で描くのが正しいので naive を使う。
#               UTC が必要な箇所（月次クレジット枠の境界）は明示的に timezone.utc を渡す
#   S110        設定ファイルの読み込み失敗は既定値へ落とすのが正しい挙動
#   RUF002/003  日本語コメントの全角記号を「紛らわしい unicode」として警告してしまう
#   UP/B/SIM    既存コードに多数当たる。入れるなら別途まとめて直す
[lint]
select = ["E4", "E7", "E9", "F", "W", "I"]
