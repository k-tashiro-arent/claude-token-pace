<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token consumption pace</title>
<style>
 :root,:root[data-theme="dark"]{--bg:#0f1115;--fg:#cdd3dc;--mut:#8b93a1;
   --tipbg:#1b1f27;--tipbd:#3a414e;--btnbd:#3a414e;--over:#e0894f;--under:#5fb87a;}
 :root[data-theme="light"]{--bg:#ffffff;--fg:#1f2430;--mut:#5b636f;
   --tipbg:#f4f5f7;--tipbd:#c2c8d0;--btnbd:#c2c8d0;--over:#c9731a;--under:#2f9e57;}
 html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
   font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
 .wrap{display:flex;flex-direction:column;height:100%;box-sizing:border-box;padding:6px 8px;}
 header{display:flex;justify-content:space-between;align-items:center;
   font-size:12px;color:var(--mut);padding:2px 4px 4px;}
 header .right{display:flex;align-items:center;gap:8px;}
 #theme,#play,#align{background:transparent;border:1px solid var(--btnbd);color:var(--fg);
   border-radius:4px;font-size:12px;line-height:1;padding:2px 7px;cursor:pointer;}
 #theme:hover,#play:hover,#align:hover{background:var(--tipbg);}
 #play:disabled,#align:disabled{opacity:.4;cursor:default;}
 #play:disabled:hover,#align:disabled:hover{background:transparent;}
 .panels{flex:1;display:flex;flex-direction:column;min-height:0;}
 .panel{flex:1;display:flex;flex-direction:column;min-height:0;}
 .phead{position:absolute;top:10px;left:44px;z-index:3;pointer-events:none;
   font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;}
 .phead .over{color:var(--over);} .phead .under{color:var(--under);} .phead .mut{color:var(--mut);}
 .pcanvas{position:relative;flex:1;min-height:0;}
 canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
 .tip{position:absolute;pointer-events:none;background:var(--tipbg);border:1px solid var(--tipbd);
   border-radius:4px;padding:4px 7px;font-size:11px;line-height:1.4;color:var(--fg);
   white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .08s;
   font-variant-numeric:tabular-nums;z-index:5;}
</style></head>
<body><div class="wrap">
 <header><span class="right"><span id="ts">loading…</span><button id="theme" title="テーマ切替">◐</button><button id="play" title="直近7dを早送り再生" disabled>▶</button><button id="align" title="全パネルを共通の時間軸（直近1か月）に揃える">Align</button></span></header>
 <div class="panels" id="panels"></div>
</div>
<script>
(function(){
 var POLL_MS=5000, TICK_MS=1000;
 var COLORS={"5h":"#e15759","7d":"#4e79a7"};   // ブランド色は両テーマ共通
 var THEMES={
   dark: {grid:"#2a2f3a",axis:"#3a414e",label:"#7a828f",hover:"#99a3b3",dot:"#0f1115"},
   light:{grid:"#e2e5ea",axis:"#c2c8d0",label:"#6b7480",hover:"#66707e",dot:"#ffffff"}
 };
 var ML=40, MR=8, MT=6, MB=18, MAX_TICKS=12;
 var data=null, lastGen=null, hover=[], theme="dark", panelCount=0;
 var alignMode=false;         // 全パネルを共通の時間軸（既定 直近1か月）に揃えるモード
 var pb=null;                 // プレイバック中の状態 {t:仮想now(epoch秒), segs:{キー:[…]}, raf:id}
 var PB_DURATION=6000;        // 早送り全体の所要(ms)。Align 再生はこの長さのまま
 var PB_SLOT=900;             // 再生カーソルを乗せる格子(秒)。pace-json.py の FC_HIST_SLOT と揃える
 var PB_MS_PER_SLOT=1000/60;  // 1 格子を 1 コマで送る（7 日なら 672 コマ＝約 11 秒）
 function T(){ return THEMES[theme]||THEMES.dark; }

 function pad(n){ return (n<10?"0":"")+n; }
 function hm(d){ return pad(d.getHours())+":"+pad(d.getMinutes()); }
 function md(d){ return pad(d.getMonth()+1)+"/"+pad(d.getDate()); }
 function fmt(epoch, mode){
   var d=new Date(epoch*1000);
   return mode==="date" ? md(d)+" "+hm(d) : hm(d);
 }
 function xlab(epoch, mode){ var d=new Date(epoch*1000); return mode==="date"? md(d) : hm(d); }

 function interp(arr, t, col){
   var c=col||1;
   if(!arr||!arr.length) return null;
   if(t<=arr[0][0]) return arr[0][c];
   if(t>=arr[arr.length-1][0]) return arr[arr.length-1][c];
   for(var i=1;i<arr.length;i++){
     if(t<=arr[i][0]){
       var a=arr[i-1], b=arr[i], s=b[0]-a[0];
       return s<=0 ? b[c] : a[c]+(b[c]-a[c])*(t-a[0])/s;
     }
   }
   return arr[arr.length-1][c];
 }
 function nearest(arr, t){
   if(!arr||!arr.length) return null;
   var best=arr[0], bd=Math.abs(arr[0][0]-t);
   for(var i=1;i<arr.length;i++){ var d=Math.abs(arr[i][0]-t); if(d<bd){bd=d;best=arr[i];} }
   return best;
 }
 // used を時刻 T までに切り詰め、末尾に補間点を足して線を T までピッタリ伸ばす
 function revealUsed(used, t){
   if(!used||!used.length) return used||[];
   if(t>=used[used.length-1][0]) return used;   // 全て可視
   if(t<used[0][0]) return [];                   // まだ何も
   var out=[];
   for(var i=0;i<used.length && used[i][0]<=t;i++) out.push(used[i]);
   var y=interp(used, t);
   if(y!==null){
     var pt=[t, y];
     if(used[0].length>2){                       // 履歴の点は [ts, used, even]
       var e=interp(used, t, 2);
       if(e!==null) pt.push(e);
     }
     out.push(pt);
   }
   return out;
 }
 // 開始済みのうち最も新しい窓を選ぶ（セグメントは開始順）。
 // Codex の枠はサービス側で名目の窓長を待たずに打ち切られ、名目の範囲が重なるため、
 // 「カーソルを含む窓」で選ぶと古い窓が残る。5h/7d は窓が順に並ぶので結果は変わらない。
 function pbSegAt(segs, t){
   var chosen=null;
   for(var i=0;i<segs.length;i++){ if(segs[i].x0<=t) chosen=segs[i]; }
   return chosen || segs[0];
 }
 function pbHasSegs(pbd){
   if(!pbd || !pbd.segs) return false;
   for(var k in pbd.segs){ if(pbd.segs[k] && pbd.segs[k].length) return true; }
   return false;
 }
 // 縦補助線の目盛り（ローカル時刻境界。setHours/setDate で DST も吸収）
 function hourTicks(x0,x1){
   var ticks=[], d=new Date(x0*1000); d.setMinutes(0,0,0);
   if(d.getTime()/1000 < x0) d.setHours(d.getHours()+1);
   while(d.getTime()/1000 <= x1){ ticks.push(d.getTime()/1000); d.setHours(d.getHours()+1); }
   return ticks;
 }
 function dayTicks(x0,x1){
   var ticks=[], d=new Date(x0*1000); d.setHours(0,0,0,0);
   if(d.getTime()/1000 < x0) d.setDate(d.getDate()+1);
   while(d.getTime()/1000 <= x1){ ticks.push(d.getTime()/1000); d.setDate(d.getDate()+1); }
   return ticks;
 }
 // pace 乖離%（status line の dev と同一）: (used-even)/(100-even)*100。余地無しは null(="-")
 function paceDev(u, e){
   if(u===null || u===undefined) return null;
   if(100-e <= 0) return null;
   return (u-e)/(100-e)*100;
 }
 // pace(-100..0..+100)を色へ: -100=マイナス側端点 / 0=無彩色(灰) / +100=赤、中間は線形補間
 // マイナス側は Claude=青 / Codex=緑（どちらのツールの枠かを一目で分けるため）
 var NEUTRAL="rgb(142,142,142)";
 var FAN_INK=0.16;            // 予測の帯を重ね切ったときの濃さ（分位の数によらず一定）
 var FAN_STALE_INK=0.11;      // 起点が今の実績から離れた予測の濃さ（通常より薄くして古さを示す）
 var FAN_STALE=[224,160,16];  // 同上の色（黄）。枠の色と変えて、今の状態に合っていないことを示す
 var UNDER_BLUE=[24,110,255], UNDER_GREEN=[22,175,95];
 function lerp(a,b,f){ return Math.round(a+(b-a)*f); }
 // パネルの key は pace-json.py の build_codex_panels が "codex " + 窓長 で作る
 function underColor(p){
   return (p && (p.key||"").indexOf("codex ")===0) ? UNDER_GREEN : UNDER_BLUE;
 }
 function colorForPace(pd, under){
   if(pd===null || pd===undefined) return NEUTRAL;
   var x = pd<-50?-50:(pd>50?50:pd);          // ±50% で飽和（外側は端点色のまま）
   var GRAY=[142,142,142], RED=[225,80,80], a,b,f;
   if(x<0){ a=under||UNDER_BLUE; b=GRAY; f=(x+50)/50; } else { a=GRAY; b=RED; f=x/50; }
   return "rgb("+lerp(a[0],b[0],f)+","+lerp(a[1],b[1],f)+","+lerp(a[2],b[2],f)+")";
 }
 // used の横グラデーション生成: 各点の pace を colFn で色化し停止点に。1点/幅0は色文字列を返す
 function paceGradient(ctx, p, X, colFn, empty){
   var u=p.used; if(!u || !u.length) return empty;
   function colAt(i){
     // 履歴モードの点は [ts, used, even] の 3 要素。窓ごとに even が違うので点が自分で持つ
     var ev=(u[i].length>2) ? u[i][2] : ((p.even && p.even.length)?interp(p.even, u[i][0]):null);
     return colFn((ev===null||ev===undefined) ? null : paceDev(u[i][1], ev));
   }
   var xa=X(u[0][0]), xb=X(u[u.length-1][0]);
   if(!(xb>xa)) return colAt(u.length-1);
   var g=ctx.createLinearGradient(xa,0,xb,0);
   for(var i=0;i<u.length;i++){
     var f=(X(u[i][0])-xa)/(xb-xa); f=f<0?0:(f>1?1:f);
     g.addColorStop(f, colAt(i));
   }
   return g;
 }
// ---- 予測の履歴（再生中の帯）----
 // forecast-hist.bin: 先頭 8+2L バイト（"TPFC"・版・分位の数 L・分位×1000）＋レコード列。
 // 1 レコードは 18 バイトの見出し（格子時刻・キーの長さ・終端時刻・刻み×100・
 // ステップ数・起点×10）、パネルのキー（UTF-8）、uint16 の本文（値×10 の時間方向差分）。
 // 枠をこちらで固定せず、予測が付いているパネルをすべて書く。pace-json.py の _fch_record と対。
 var fcHist=null, fcHistState=0, fcHistAt=0;   // 0=未取得 1=取得中 2=取得済 3=取れなかった
 function parseFcHist(buf){
   var dv=new DataView(buf), u8=new Uint8Array(buf), len=buf.byteLength, i;
   if(len<8 || dv.getUint32(0,false)!==0x54504643) return null;   // "TPFC"
   if(dv.getUint16(4,true)!==2) return null;                      // 版が違えば使わない
   var L=dv.getUint16(6,true); if(!L || len<8+2*L) return null;
   var levels=[]; for(i=0;i<L;i++) levels.push(dv.getUint16(8+2*i,true)/1000);
   var map={}, off=8+2*L;
   while(off+18<=len){
     var klen=dv.getUint16(off+4,true), n=dv.getUint16(off+14,true);
     var body=off+18+klen, end=body+2*n*L;
     if(end>len) break;                                           // 途中で切れている
     var key=""; for(i=0;i<klen;i++) key+=String.fromCharCode(u8[off+18+i]);   // キーは ASCII
     map[key+"|"+dv.getUint32(off,true)]=
       {tend:dv.getUint32(off+6,true), step:dv.getUint32(off+10,true)/100, n:n, off:body};
     off=end;
   }
   return {dv:dv, L:L, levels:levels, map:map};
 }
 // 格子に乗ったカーソル時刻とパネルのキーに合う記録を、帯が使える形（ライブの fc と同じ）へ
 function fcHistFind(key, t, x1){
   var h=fcHist; if(!h || !key) return null;
   var r=h.map[key+"|"+t]; if(!r) return null;
   if(Math.abs(r.tend-x1)>120) return null;        // ライブと同じ窓の突き合わせ
   var L=h.L, acc=[], pts=[], o=r.off, j, k;
   for(k=0;k<L;k++) acc.push(0);
   for(j=0;j<r.n;j++){
     var row=[r.tend-(r.n-1-j)*r.step];
     for(k=0;k<L;k++){ acc[k]+=h.dv.getUint16(o,true); o+=2; row.push(acc[k]/10); }
     pts.push(row);
   }
   return {levels:h.levels, pts:pts, stale:false};  // カーソル＝予測の時刻なので起点はずれない
 }

 // 予測の中央値の系列 [[ts, 中央値], …]。帯を描いているときだけ返す（条件は帯の描画と同じ）
 function fcMedian(p){
   if(pb || alignMode) return null;
   var fc=p && p.fc;
   if(!fc || !fc.levels || !fc.pts || fc.pts.length<2) return null;
   var mi=0, best=1e9;
   for(var i=0;i<fc.levels.length;i++){ var d=Math.abs(fc.levels[i]-0.5); if(d<best){ best=d; mi=i; } }
   return fc.pts.map(function(r){ return [r[0], r[1+mi]]; });
 }

 // 使用量が下がる箇所は空白として扱い、線もフィルもつながない（両モード共通）。
 // used% は窓ごとに包絡（単調非減少）してあるので、下降が起きるのは窓の切り替わりか
 // 窓内リセットだけ。どちらも連続した消費ではないので、つないで描くと存在しない
 // 下降に見える。標準ペース線も窓内では単調増加なので、同じ規則で切れる。
 // 区間を描画範囲 [x0,x1] に切り詰める（両端は補間点を足して線を軸まで届かせる）。
 // Hist はデータを表示幅の倍（既定 60 日）持つので、切らないと軸の外に描いてしまう。
 function clipRun(run, x0, x1){
   var out=[], i, a, b, y, e;
   function at(p0, p1, t){          // p0-p1 間の t 時点。even(3要素目) も引き継ぐ
     var q=[t, interp([p0,p1], t)];
     if(p0.length>2 && p1.length>2){ e=interp([p0,p1], t, 2); if(e!==null) q.push(e); }
     return q;
   }
   for(i=0;i<run.length;i++){
     b=run[i];
     if(b[0]<x0){ continue; }
     if(b[0]>x1){
       if(out.length && i>0){ y=at(run[i-1], b, x1); if(y[1]!==null) out.push(y); }
       break;
     }
     if(!out.length && i>0 && run[i-1][0]<x0){    // 左端へ届かせる
       y=at(run[i-1], b, x0); if(y[1]!==null) out.push(y);
     }
     out.push(b);
   }
   return out;
 }
 function splitRuns(u){
   var runs=[], cur=[];
   for(var i=0;i<u.length;i++){
     if(i>0 && u[i][1]<u[i-1][1]){
       if(cur.length) runs.push(cur);
       cur=[];
     }
     cur.push(u[i]);
   }
   if(cur.length) runs.push(cur);
   return runs;
 }

 // パネル DOM をデータのパネル数に合わせて作り直す（5h/7d の 2 枚、月次があれば 3 枚）
 function ensurePanels(n){
   if(n===panelCount) return;
   var host=document.getElementById("panels");
   host.innerHTML="";
   for(var i=0;i<n;i++){
     var d=document.createElement("div");
     d.className="panel";
     d.innerHTML='<div class="pcanvas"><canvas id="c'+i+'"></canvas>'
       +'<div class="phead" id="h'+i+'">…</div><div class="tip" id="t'+i+'"></div></div>';
     host.appendChild(d);
   }
   hover=[]; for(var j=0;j<n;j++) hover.push(null);
   panelCount=n;
   for(var k=0;k<n;k++) bindHover(k);
 }

// Align モードのビュー: 系列を履歴(hist)に、軸を全パネル共通の [hist_x0, hist_x1] に差し替える。
 // ヘッダ（used_now / std_now / reset）は現在窓のままにする。
 // 標準ペース線は、30 日でも窓が少なく読める枠（7d / 1mo）だけ hist_even を持つ。
 function viewOf(p){
   if(!alignMode || !p || !p.hist || !p.hist.length) return p;
   if(!data || data.hist_x0===undefined || data.hist_x1===undefined) return p;
   // 通常は直近 30 日。再生中は同じ幅の窓が、右端＝再生カーソルとして滑る
   // （データが 60 日ぶんあれば、開始時の窓は 60 日前〜30 日前）。
   var x0=data.hist_x0, x1=data.hist_x1;
   if(pb && pb.align){ x1=pb.t; x0=pb.slide ? (pb.t-pb.width) : data.hist_x0; }
   return { key:p.key, xmode:"date", x0:x0, x1:x1,
            reset_label:p.reset_label, used:p.hist, even:(p.hist_even||[]),
            used_now:p.used_now, std_now:p.std_now };
 }
 function alignAvailable(){
   return !!(data && data.hist_x0!==undefined
             && data.panels.some(function(p){ return p.hist && p.hist.length; }));
 }

 function setHeader(idx, p){
   var h=document.getElementById("h"+idx);
   if(alignMode && p.hist && p.hist.length){
     h.innerHTML=p.key;      // 履歴モードは枠の名前だけ（used/pace/reset は現在窓の話なので出さない）
     return;
   }
   if(p.used_now===null || p.used_now===undefined){
     h.innerHTML=p.key+' <span class="mut">データ収集中…</span>';
     return;
   }
   var pd=paceDev(p.used_now, p.std_now), paceStr;
   if(pd===null){
     paceStr='<span class="mut">pace -</span>';
   } else {
     var sign=pd>=0?"+":"-";
     paceStr='<span style="color:'+colorForPace(pd, underColor(p))+'">pace '+sign+Math.round(Math.abs(pd))+'%</span>';
   }
   h.innerHTML=p.key+' used '+p.used_now.toFixed(0)+'%'
     +' '+paceStr
     +' <span class="mut">&rarr;reset '+p.reset_label+'</span>';
 }

 function draw(idx){
   var cv=document.getElementById("c"+idx), ctx=cv.getContext("2d");
   var dpr=window.devicePixelRatio||1, cssW=cv.clientWidth, cssH=cv.clientHeight;
   if(cssW<2||cssH<2) return;
   cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssH*dpr);
   ctx.setTransform(dpr,0,0,dpr,0,0);
   ctx.clearRect(0,0,cssW,cssH);
   // 通常はライブのパネル。プレイバック中は各パネル=仮想now時点のセグメント（無ければライブへ縮退）
   var p, nowT;
   if(pb){ nowT=pb.t; p=pbActive(idx, pb.t); }
   else { nowT=Date.now()/1000; p = data && data.panels[idx]; }
   if(!p) return;
   p = viewOf(p);

   var pw=cssW-ML-MR, ph=cssH-MT-MB;
   if(pw<10||ph<10) return;
   var x0=p.x0, x1=p.x1;
   function X(t){ return ML + (x1<=x0?0:(t-x0)/(x1-x0))*pw; }
   function Y(v){ v=v<0?0:(v>100?100:v); return MT + (1-v/100)*ph; }

   ctx.font="10px system-ui,sans-serif"; ctx.textBaseline="middle";
   [0,20,40,60,80,100].forEach(function(g){          // パーセント軸: 20%単位
     var y=Y(g);
     ctx.strokeStyle=T().grid; ctx.lineWidth=1;
     ctx.beginPath(); ctx.moveTo(ML,y+0.5); ctx.lineTo(ML+pw,y+0.5); ctx.stroke();
     ctx.fillStyle=T().label; ctx.textAlign="right"; ctx.fillText(String(g), ML-5, y);
   });
   // 縦補助線 + X軸目盛り（同じ位置）: 5h=1時間ごと / 7d=1日ごと。多すぎる場合は間引く（月次=31日）
   var ticks = (p.xmode==="date" ? dayTicks(x0,x1) : hourTicks(x0,x1));
   if(ticks.length>MAX_TICKS){
     var st=Math.ceil(ticks.length/MAX_TICKS), th=[];
     for(var ti=0;ti<ticks.length;ti+=st) th.push(ticks[ti]);
     ticks=th;
   }
   ctx.strokeStyle=T().grid; ctx.lineWidth=1;
   ticks.forEach(function(t){
     var gx=Math.round(X(t))+0.5;
     ctx.beginPath(); ctx.moveTo(gx,MT); ctx.lineTo(gx,MT+ph); ctx.stroke();
   });
   ctx.strokeStyle=T().axis; ctx.lineWidth=1;
   ctx.beginPath(); ctx.moveTo(ML,MT); ctx.lineTo(ML,MT+ph); ctx.lineTo(ML+pw,MT+ph); ctx.stroke();

   ctx.fillStyle=T().label; ctx.textBaseline="alphabetic";
   ticks.forEach(function(t){
     var lx=X(t);
     ctx.textAlign = lx<ML+18 ? "left" : (lx>ML+pw-18 ? "right" : "center");
     ctx.fillText(xlab(t,p.xmode), lx, cssH-4);
   });

   // 予測の帯: router が出した「リセットまでの使用率」の確率分布。外側の分位の対から順に
   // 重ねるので、確率の高い内側ほど濃くなる（＝密度がそのまま濃さになる）。
   // 1 層の濃さは分位の数から決める。層を重ねた中心の濃さが FAN_INK で一定になるので、
   // 分位を細かくしても全体が黒くつぶれず、見た目の基準が変わらない。
   // ライブ表示のときだけ出す（Align は履歴、再生は過去の仮想時刻なので、今の予測は当てはまらない）。
   // ライブは pace.json の fc、再生中は forecast-hist.bin のカーソル時点の記録を使う。
   var fan = pb ? (pb.align ? null : fcHistFind(p.key||"", pb.t, p.x1))
                : (alignMode ? null : p.fc);
   if(fan && fan.levels && fan.pts && fan.pts.length>1){
     var fp=fan.pts, nband=fan.levels.length>>1;     // 分位の対の数（奇数個なら中央は帯にならない）
     // 起点が今の実績から離れた予測は、消さずに黄色・薄くして描く（消すと理由が伝わらない）
     var fu=fan.stale?FAN_STALE:underColor(p), fink=fan.stale?FAN_STALE_INK:FAN_INK;
     var frgb=fu[0]+","+fu[1]+","+fu[2];
     var fa=1-Math.pow(1-fink, 1/Math.max(nband,1));
     ctx.fillStyle="rgba("+frgb+","+fa.toFixed(4)+")";
     for(var bi=0;bi<nband;bi++){                    // 外側の対から内側の対へ
       var lo=1+bi, hi=fan.levels.length-bi;         // pts の各行は [ts, 分位…]
       ctx.beginPath();
       fp.forEach(function(r,i){ var xx=X(r[0]), yy=Y(r[hi]); i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); });
       for(var k=fp.length-1;k>=0;k--) ctx.lineTo(X(fp[k][0]), Y(fp[k][lo]));
       ctx.closePath(); ctx.fill();
     }
   }

   if(p.even && p.even.length){
     ctx.strokeStyle=T().label; ctx.globalAlpha=0.8; ctx.lineWidth=1.3; ctx.setLineDash([2,3]);
     splitRuns(p.even).map(function(run){ return clipRun(run, x0, x1); })
       .filter(function(run){ return run.length; })
       .forEach(function(run){                        // 窓の切り替わりでは繋がない
       ctx.beginPath();
       run.forEach(function(pt,i){ var xx=X(pt[0]),yy=Y(pt[1]); i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); });
       ctx.stroke();
     });
     ctx.setLineDash([]); ctx.globalAlpha=1;
   }

   var uc=underColor(p);                              // マイナス側の端点色（Claude=青 / Codex=緑）
   var colFn=function(pd){ return colorForPace(pd, uc); };
   var pu = pb ? revealUsed(p.used, nowT) : p.used;   // 再生中はカーソルまで
   if(pu && pu.length){
     var grad=paceGradient(ctx, {used:pu, even:p.even}, X, colFn, NEUTRAL);   // 端点色-灰-赤（無彩色を挟む・不透明）
     ctx.fillStyle=grad; ctx.strokeStyle=grad; ctx.lineWidth=1.8;
     splitRuns(pu).map(function(run){ return clipRun(run, x0, x1); })
       .filter(function(run){ return run.length; }).forEach(function(run){
       ctx.beginPath(); ctx.moveTo(X(run[0][0]), Y(0));
       run.forEach(function(pt){ ctx.lineTo(X(pt[0]), Y(pt[1])); });
       ctx.lineTo(X(run[run.length-1][0]), Y(0)); ctx.closePath();
       ctx.globalAlpha=0.18; ctx.fill(); ctx.globalAlpha=1;                    // フィルは一律18%
       ctx.beginPath();
       run.forEach(function(pt,i){ var xx=X(pt[0]),yy=Y(pt[1]); i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); });
       ctx.stroke();
     });
   }

   if(nowT>=x0 && nowT<=x1){
     var xn=X(nowT);
     ctx.strokeStyle="#888"; ctx.globalAlpha=0.7; ctx.lineWidth=1; ctx.setLineDash([3,3]);
     ctx.beginPath(); ctx.moveTo(xn,MT); ctx.lineTo(xn,MT+ph); ctx.stroke();
     ctx.setLineDash([]); ctx.globalAlpha=1;
   }

   var tip=document.getElementById("t"+idx), ht=hover[idx];
   // 実績の最後より右（＝予測の帯の上）では、予測の中央値を基準点にする。
   // used も pace もその中央値から計算するので、表示の読み方は実績と変わらない。
   var fcm=fcMedian(p), lastU=(p.used && p.used.length) ? p.used[p.used.length-1][0] : null;
   var useFc=!!(fcm && ht!==null && (lastU===null || ht>lastU));
   if(!pb && ht!==null && ht>=x0 && ht<=x1 && ((p.used && p.used.length) || useFc)){
     var np=useFc ? nearest(fcm, ht) : nearest(p.used, ht);
     var ev=(np.length>2) ? np[2] : interp(p.even, np[0]);
     var hx=X(np[0]), hy=Y(np[1]);
     ctx.strokeStyle=T().hover; ctx.globalAlpha=0.5; ctx.lineWidth=1; ctx.setLineDash([2,2]);
     ctx.beginPath(); ctx.moveTo(hx,MT); ctx.lineTo(hx,MT+ph); ctx.stroke();
     ctx.setLineDash([]); ctx.globalAlpha=1;
     ctx.fillStyle=colorForPace(ev===null ? null : paceDev(np[1], ev), uc);
     ctx.beginPath(); ctx.arc(hx,hy,3,0,Math.PI*2); ctx.fill();
     ctx.strokeStyle=T().dot; ctx.lineWidth=1; ctx.stroke();
     var s=fmt(np[0],p.xmode)+"<br>used <b>"+np[1].toFixed(1)+"%</b>";
     if(ev!==null){
       var pdv=paceDev(np[1], ev);
       s+="<br>even "+ev.toFixed(1)+"%";
       s+="<br>pace "+((pdv===null) ? "-" : (pdv>=0?"+":"-")+Math.abs(pdv).toFixed(1)+"%");
     }
     tip.innerHTML=s;
     tip.style.left=hx+"px"; tip.style.top=Math.max(hy,MT+14)+"px"; tip.style.opacity=1;
   } else { tip.style.opacity=0; }
 }

 function drawAll(){ if(pb) return; for(var i=0;i<panelCount;i++) draw(i); }

 function apply(j){
   data=j;
   ensurePanels(j.panels.length);
   for(var i=0;i<j.panels.length;i++) setHeader(i, j.panels[i]);
   drawAll();
   document.getElementById("ts").textContent="updated "+hm(new Date());
   var pbd=j.playback;
   document.getElementById("play").disabled = alignMode
     ? !alignAvailable()
     : !pbHasSegs(pbd);
   applyAlignButton();
 }

 // ---- プレイバック（直近7d早送り。各パネルの窓リセットも再現） ----
 function pbActive(idx, t){             // 仮想now=t で表示するセグメント（無ければライブパネルへ縮退）
   if(pb.align) return data && data.panels[idx];   // Hist は軸固定。viewOf が履歴系列へ差し替える
   var lp=data && data.panels[idx];                // セグメントはパネルのキーで引く（1mo は作らない→ライブのまま）
   var segs=(lp && pb.segs) ? pb.segs[lp.key] : null;
   return (segs && segs.length) ? pbSegAt(segs, t) : lp;
 }
 function pbHeader(idx, p, t){          // 再生カーソル t 時点の used/even を反映したヘッダ
   var pu=revealUsed(p.used, t);
   var un=pu.length ? pu[pu.length-1][1] : null;
   var ev=(p.even && p.even.length) ? interp(p.even, t) : null;
   return { key:(p.key||""), used_now:un, std_now:(ev===null?0:ev), reset_label:p.reset_label };
 }
 function startPlayback(){
   if(pb) return;
   var pbd=data && data.playback, start, end, align=alignMode && alignAvailable();
   // 再生中の帯に使う予測の履歴は ▶ のときだけ取りに行く（普段のページは今までどおり）。
   // 取れなくても帯が出ないだけで再生はできる。格子 1 つ分より古くなっていたら取り直す。
   if(!align && (fcHistState===0 || (fcHistState>1 && Date.now()-fcHistAt>PB_SLOT*1000))){
     fcHistState=1;
     fetch("forecast-hist.bin", {cache:"no-store"})
       .then(function(r){ return r.ok ? r.arrayBuffer() : null; })
       .then(function(b){ fcHist = b ? parseFcHist(b) : null; })
       .catch(function(){ fcHist=null; })
       .then(function(){ fcHistState=fcHist?2:3; fcHistAt=Date.now(); startPlayback(); });
     return;
   }
   if(fcHistState===1) return;                 // 取得中。終わったら自分で始まる
   var width=0, slide=false;
   if(align){
     // 表示幅（既定 30 日）の窓を、データの左端（既定 60 日前・記録が短ければ最古）から
     // 滑らせる。データが表示幅ぶんしか無いときは滑らせようがないので、そのときは
     // 左端据え置きで右端だけ伸ばす。
     width=data.hist_x1-data.hist_x0;
     var lo=(data.hist_lo!==undefined)?data.hist_lo:data.hist_x0;
     slide=(lo+width)<data.hist_x1;
     start=slide ? (lo+width) : data.hist_x0;
     end=data.hist_x1;
   } else {
     if(!pbHasSegs(pbd)) return;
     start=pbd.start; end=Math.max(pbd.now, Date.now()/1000);
   }
   if(!(end>start)) return;
   // 再生カーソルを予測の保存格子（15 分）に乗せる。帯の起点とカーソルが必ず一致し、
   // 絵の数が画面のリフレッシュレートに左右されなくなる。Align 再生は履歴なので対象外。
   var gs=0, nslot=0, dur=PB_DURATION;
   if(!align){
     gs=Math.ceil(start/PB_SLOT)*PB_SLOT;
     nslot=Math.floor((end-gs)/PB_SLOT)+1;
     if(nslot<1) nslot=0;                      // 格子が 1 つも入らない→これまでどおり連続で送る
     else dur=Math.max(PB_DURATION, nslot*PB_MS_PER_SLOT);
   }
   document.getElementById("play").disabled=true;
   document.getElementById("ts").textContent="▶ playback";
   pb={ t:start, align:align, width:width, slide:slide,
        segs:(pbd&&pbd.segs)||{}, raf:0 };
   var t0=performance.now();
   function frame(){
     var f=(performance.now()-t0)/dur; if(f>1) f=1;
     pb.t = nslot ? (gs+Math.min(nslot-1, Math.floor(f*nslot))*PB_SLOT)
                  : (start+(end-start)*f);
     for(var i=0;i<panelCount;i++){
       if(pb.align){
         setHeader(i, data.panels[i]);        // Hist のヘッダは枠の名前だけ
       } else {
         var ap=pbActive(i, pb.t);
         if(ap) setHeader(i, pbHeader(i, ap, pb.t));
       }
       draw(i);
     }
     if(f<1){ pb.raf=requestAnimationFrame(frame); } else { endPlayback(); }
   }
   pb.raf=requestAnimationFrame(frame);
 }
 function endPlayback(){
   if(pb && pb.raf) cancelAnimationFrame(pb.raf);
   pb=null;
   if(data) apply(data);   // ライブ表示へ復帰（ヘッダ再設定・drawAll・ts更新・ボタン再有効化）
 }

 function poll(){
   if(pb) return;           // 再生中はライブ反映を止める（数秒で復帰）
   fetch("pace.json?t="+Date.now(), {cache:"no-store"})
     .then(function(r){ if(!r.ok) throw 0; return r.json(); })
     .then(function(j){ if(j.generated_at!==lastGen){ lastGen=j.generated_at; apply(j); } })
     .catch(function(){ document.getElementById("ts").textContent="waiting for pace.json…"; });
 }

 function bindHover(idx){
   var cv=document.getElementById("c"+idx);
   cv.addEventListener("mousemove", function(e){
     if(pb) return;
     var p=data&&data.panels[idx]; if(!p) return;
     p = viewOf(p);
     var rect=cv.getBoundingClientRect(), mx=e.clientX-rect.left, pw=cv.clientWidth-ML-MR;
     if(mx<ML || mx>ML+pw){ hover[idx]=null; draw(idx); return; }
     hover[idx]=p.x0 + (mx-ML)/pw*(p.x1-p.x0); draw(idx);
   });
   cv.addEventListener("mouseleave", function(){ hover[idx]=null; draw(idx); });
 }

 function applyTheme(){
   document.documentElement.setAttribute("data-theme", theme);
   var b=document.getElementById("theme");
   b.textContent = theme==="dark" ? "☀" : "☾";   // ☀ / ☾ = 切替後の基調
   b.title = theme==="dark" ? "白基調へ" : "黒基調へ";
   drawAll();
 }
 (function initTheme(){
   var s=null; try{ s=localStorage.getItem("tp-theme"); }catch(e){}
   if(s==="light"||s==="dark"){ theme=s; }
   else if(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches){ theme="light"; }
   applyTheme();
 })();
 document.getElementById("theme").addEventListener("click", function(){
   theme = theme==="dark" ? "light" : "dark";
   try{ localStorage.setItem("tp-theme", theme); }catch(e){}
   applyTheme();
 });
// 履歴モードの切り替え（テーマと同じく記憶する）
 function applyAlignButton(){
   var b=document.getElementById("align");
   b.disabled = !alignAvailable();
   b.style.opacity = alignMode ? "1" : "";
   b.style.borderColor = alignMode ? "var(--fg)" : "";
   b.title = alignMode ? "各枠の窓ごとの表示へ戻す" : "全パネルを共通の時間軸（直近1か月）に揃える";
 }
 document.getElementById("align").addEventListener("click", function(){
   if(pb) return;                       // 再生中は切り替えない
   alignMode = !alignMode;
   try{ localStorage.setItem("tp-align", alignMode ? "1" : "0"); }catch(e){}
   if(data) apply(data);                // ヘッダ・▶ の状態も含めて描き直す
   else applyAlignButton();
 });
 (function initAlign(){
   var v=null; try{ v=localStorage.getItem("tp-align"); }catch(e){}
   alignMode = (v==="1");
   applyAlignButton();
 })();
 document.getElementById("play").addEventListener("click", startPlayback);

 window.addEventListener("resize", drawAll);
 ensurePanels(2);          // pace.json 到着前でも枠を出す（到着後に月次があれば 3 枚へ）
 poll(); setInterval(poll, POLL_MS); setInterval(drawAll, TICK_MS);
})();
</script>
</body></html>
